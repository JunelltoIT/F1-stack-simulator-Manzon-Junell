<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Queue Simulator{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<main class="container py-4">
  <nav class="site-nav mb-4" aria-label="Main navigation">
    <a class="brand" href="{{ url_for('index') }}">Queue Simulator</a>
    <a href="{{ url_for('contact') }}">About</a>
  </nav>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>
<script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
<script src="{{ url_for('static', filename='js/ui.js') }}"></script>
</body>
</html>
